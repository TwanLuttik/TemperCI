# Example host-agent config.
# Copy to /etc/temperci/agent.toml and adjust for the host.

# Control plane base URL (use https:// when control TLS is enabled).
control_url = "http://127.0.0.1:8080"

# Identity + shared token (must match control agent_token).
# agent_id defaults to hostname when omitted.
# agent_id = "ubuntu-kvm-1"
agent_token = "replace-with-long-random-string"

# Optional TLS when talking to control over HTTPS.
# tls_ca_file = "/etc/temperci/tls/control-ca.crt"
# Client cert for mTLS (when control has tls_client_ca_file set):
# tls_cert_file = "/etc/temperci/tls/agent.crt"
# tls_key_file = "/etc/temperci/tls/agent.key"
# tls_insecure_skip_verify = false

# Claim poll interval when idle (seconds).
poll_interval_seconds = 1

# After bind, wait this many seconds then destroy (dev/demo only).
# Production Firecracker: set 0 — agent waits for guest runner.exit on inject disk.
job_simulate_seconds = 0

# Max wait for real runner when job_simulate_seconds=0 (default 6h if unset/0 on firecracker).
# job_deadline_seconds = 7200

# Warm pool sizing. max_ready is also the max concurrent job capacity reported to control.
min_ready = 1
max_ready = 2

# Hard cap on tracked VMs (warm+busy+destroying+pool_boot). Prevents unbounded
# growth if destroy fails. Default: max_ready + 32.
# max_total_vms = 34

# Host headroom the agent will not give to microVMs.
# Effective max_ready is min(max_ready, how many VMs fit in leftover RAM/disk).
# A create is refused if MemAvailable < memory_mib or free disk < overlay+reserve.
# CPU is not a hard gate.
# host_reserve_memory_mib = 2048
# host_reserve_disk_mib = 5120

# Guest image and kernel. kernel_path is required when vmm_backend = "firecracker".
# Prefer local NVMe for images + instance scratch (avoid shared Ceph/NFS for instances/).
image_path = "/var/lib/temperci/images/ubuntu-2404-runner.ext4"
kernel_path = "/var/lib/temperci/images/vmlinux"
data_dir = "/var/lib/temperci"
# scratch_dir is accepted for compatibility; parent of .../instances becomes data_dir.
# scratch_dir = "/var/lib/temperci/instances"

# Default VM resources (used when [[shapes]] is omitted).
vcpu = 4
memory_mib = 8192

# One or more sizes. min_ready=0 means do not keep that size warm; jobs still
# cold-boot it when the workflow asks (runs-on: temperci-2vcpu-4g-ubuntu-2404).
# The 4 vCPU / 8 GiB row matches the legacy label temperci-4vcpu-ubuntu-2404.
# [[shapes]]
# label = "temperci-4vcpu-ubuntu-2404"
# vcpu = 4
# memory_mib = 8192
# min_ready = 1
# [[shapes]]
# label = "temperci-2vcpu-4g-ubuntu-2404"
# vcpu = 2
# memory_mib = 4096
# min_ready = 0

# Idle warm VM recycle after this many seconds (0 = disabled).
idle_recycle_seconds = 3600

# Production on Linux/KVM (Ubuntu host): firecracker.
# Use fake only for unit tests / macOS without KVM.
vmm_backend = "firecracker"

# How often the pool reconciler runs (seconds).
reconcile_interval_seconds = 1

# Local metrics + admin (drain/reload). Prefer loopback.
# GET /metrics  POST /v1/admin/pool/drain  POST /v1/admin/pool/reload
# Admin routes use agent_token as Bearer.
# metrics_listen_addr = "127.0.0.1:9091"

# Host-local GitHub Actions cache (actions/cache, setup-node, setup-go).
# Empty disables the gateway. A listen address NAT-redirects ALL guest :443
# to this bind so the SNI multiplexer can intercept cache hosts and splice
# everything else (github.com, runner pipelines) to the real destination.
# Bind 127.0.0.1:port (not the tap IP). Guest image must trust the TemperCI
# cache CA (deploy/ubuntu/install-cache-ca.sh). Restart the agent after change.
cache_listen_addr = ""
# cache_listen_addr = "127.0.0.1:8743"
# cache_max_bytes = 53687091200  # 50 GiB LRU across all repos on this host
# The same intercept also terminates Docker Hub + GHCR (oci_cache_max_bytes).
# oci_cache_max_bytes = 107374182400  # 100 GiB LRU for image layers + build cache
