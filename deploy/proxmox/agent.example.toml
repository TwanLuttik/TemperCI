# Example host-agent config for a Proxmox VE node.
# Same keys as deploy/agent.example.toml — copy to /etc/temperci/agent.toml.
# Prefer host-level agent (Firecracker on PVE host KVM); see nested-virt.md.

control_url = "http://127.0.0.1:8080"

# Use the Proxmox node name for clearer multi-host logs (optional).
# agent_id = "pve1"
agent_token = "replace-with-long-random-string"

poll_interval_seconds = 1

# Real guest + runner: 0 (finish when runner exits — production path).
# Dev without waiting on runner: small positive number.
job_simulate_seconds = 0

# Keep pool small when sharing the node with Proxmox VMs.
min_ready = 1
max_ready = 2
# max_total_vms = 34

# Local path only — do not put instances/ on Ceph/NFS (see storage.md).
image_path = "/var/lib/temperci/images/ubuntu-2404-runner.ext4"
kernel_path = "/var/lib/temperci/images/vmlinux"
data_dir = "/var/lib/temperci"

vcpu = 4
memory_mib = 8192

idle_recycle_seconds = 3600

# Production on Proxmox host: firecracker. Use fake only for tests.
vmm_backend = "firecracker"

reconcile_interval_seconds = 1
